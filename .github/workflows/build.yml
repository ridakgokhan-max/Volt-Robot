name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Turkce ses modelini indir (Vosk, internetsiz calisir)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          unzip -q model.zip -d modeltmp
          mv modeltmp/* app/src/main/assets/model-tr
          ls -la app/src/main/assets/model-tr
      - name: Yuz tanima modeli (MobileFaceNet) indir
        run: |
          for u in \
            https://github.com/estebanuri/face_recognition/raw/master/android/face-recognition/app/src/main/assets/mobile_face_net.tflite \
            https://raw.githubusercontent.com/MCarlomagno/FaceRecognitionAuth/master/assets/mobilefacenet.tflite \
            https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite \
            https://github.com/sirius-ai/MobileFaceNet_TF/raw/master/arch/pretrained_model/MobileFaceNet_9925_9680.tflite ; do
            echo "deneniyor: $u"
            if curl -fsSL -o app/src/main/assets/mobile_face_net.tflite "$u"; then echo "INDI: $u"; break; fi
          done
          ls -la app/src/main/assets/ || true
          pip install -q ai-edge-litert 2>/dev/null && python3 -c "
          from ai_edge_litert.interpreter import Interpreter
          i=Interpreter('app/src/main/assets/mobile_face_net.tflite'); print('GIRIS',i.get_input_details()[0]['shape'],i.get_input_details()[0]['dtype'],'CIKIS',i.get_output_details()[0]['shape'])" || true
      - name: llama.cpp (yapay zeka motoru) indir
        run: |
          git clone https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          cd app/src/main/cpp/llama.cpp && git checkout -q e358d59178377be4c58ba567925e05faadbccb57 && git log -1 --oneline
      - name: Derle
        shell: bash
        run: |
          set -o pipefail
          export VOLT_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")
          ls "$ANDROID_HOME/cmake" || true
          export VOLT_CMAKE_VERSION=$(ls "$ANDROID_HOME/cmake" | sort -V | tail -1)
          echo "NDK=$VOLT_NDK_VERSION CMAKE=$VOLT_CMAKE_VERSION"
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Sonucu builds dalina koy
        if: always()
        shell: bash
        run: |
          mkdir out
          cp build.log out/ 2>/dev/null || echo "log yok" > out/build.log
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk out/VoltRobot.apk
            echo "OK ${GITHUB_SHA}" > out/STATUS
          else
            echo "FAIL ${GITHUB_SHA}" > out/STATUS
          fi
          cd out
          git init -q
          git checkout -q -b builds
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
