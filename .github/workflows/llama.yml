name: llama.cpp Android (Mi 6 testi)
on:
  push:
    branches: [main]
    paths: [".github/workflows/llama.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: llama.cpp indir
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp
      - name: Android icin derle (Snapdragon 835 = armv8.0, dotprod yok)
        shell: bash
        run: |
          set -o pipefail
          cd llama.cpp
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8-a \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF 2>&1 | tee ../llama_build.log
          cmake --build build-android -j4 --target llama-bench llama-cli 2>&1 | tee -a ../llama_build.log
          cmake --build build-android -j4 --target llama-completion 2>&1 | tee -a ../llama_build.log || true
          cmake --build build-android -j4 --target llama-simple 2>&1 | tee -a ../llama_build.log || true
          git log -1 --format="%H %cd" > ../llama_version.txt
      - name: Sonucu llama-bin dalina koy
        if: always()
        shell: bash
        run: |
          mkdir out
          cp llama_build.log llama_version.txt out/ 2>/dev/null || true
          for b in llama-bench llama-cli llama-completion llama-simple; do
            f=llama.cpp/build-android/bin/$b
            [ -f "$f" ] && cp "$f" out/ && "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/$b || true
          done
          ls -la out > out/LISTE.txt
          cd out
          git init -q
          git checkout -q -b llama-bin
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "llama ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" llama-bin
